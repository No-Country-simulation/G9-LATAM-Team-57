<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Análisis Energético</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --success-color: #16a34a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.25rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .result-hidden {
            display: none;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
            background-color: var(--primary-color);
            margin-bottom: 12px;
        }

        .metric-box {
            background-color: #eff6ff;
            border-left: 4px solid var(--primary-color);
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 4px;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        ul.recommendations-list {
            padding-left: 20px;
            margin: 0;
        }

        ul.recommendations-list li {
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .spinner {
            display: none;
            text-align: center;
            padding: 20px;
            font-weight: bold;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- FORMULARIO DE ENTRADA -->
    <div class="card">
        <h2>📋 Datos del Hogar</h2>
        <form id="energiaForm">

            <div class="form-group">
                <label for="householdSize">Personas en la vivienda:</label>
                <input type="number" id="householdSize" value="3" min="1" required>
            </div>

            <div class="form-group">
                <label for="equipmentCount">Cantidad de electrodomésticos:</label>
                <input type="number" id="equipmentCount" value="6" min="0" required>
            </div>

            <div class="form-group">
                <label for="consumoTotalMesAnterior">Consumo Mes Anterior (kWh):</label>
                <input type="number" step="0.1" id="consumoTotalMesAnterior" value="280.5" required>
            </div>

            <div class="form-group">
                <label for="peakUsageLevel">Nivel de uso en horas pico:</label>
                <select id="peakUsageLevel">
                    <option value="LOW">Bajo (LOW)</option>
                    <option value="MEDIUM">Medio (MEDIUM)</option>
                    <option value="HIGH" selected>Alto (HIGH)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="housingType">Tipo de Vivienda:</label>
                <select id="housingType">
                    <option value="CASA" selected>Casa</option>
                    <option value="DEPARTAMENTO">Departamento</option>
                    <option value="MONOAMBIENTE">Monoambiente</option>
                </select>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="hasAc" value="1" checked>
                <label for="hasAc">¿Posee Aire Acondicionado?</label>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="homeOffice">
                <label for="homeOffice">¿Realiza Trabajo Remoto / Home Office?</label>
            </div>

            <button type="submit">Enviar Análisis</button>
        </form>
    </div>

    <!-- PANEL DE SALIDA -->
    <div class="card">
        <h2>🍽️ Resultado del Análisis</h2>

        <div id="loading" class="spinner">
            Procesando pedido en cocina... ⏳
        </div>

        <div id="resultPanel" class="result-hidden">
            <div>
                <span>Diagnóstico de Eficiencia:</span><br>
                <span id="categoriaBadge" class="badge">Procesado</span>
                <small>(Confianza IA: <span id="probabilidadText">0%</span>)</small>
            </div>

            <div class="metric-box">
                <small>Costo Estimado Mensual:</small>
                <div id="costoValue" class="metric-value">$0.00</div>
            </div>

            <h3>💡 Recomendaciones Personalizadas:</h3>
            <ul id="recomendacionesList" class="recommendations-list">
                <!-- Inyección dinámica -->
            </ul>
        </div>
    </div>
</div>

<script>
    document.getElementById('energiaForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        document.getElementById('resultPanel').classList.add('result-hidden');
        document.getElementById('loading').style.display = 'block';

        const payload = {
            householdSize: parseInt(document.getElementById('householdSize').value),
            equipmentCount: parseInt(document.getElementById('equipmentCount').value),
            consumoTotalMesAnterior: parseFloat(document.getElementById('consumoTotalMesAnterior').value),
            peakUsageLevel: document.getElementById('peakUsageLevel').value,
            housingType: document.getElementById('housingType').value,
            hasAc: document.getElementById('hasAc').checked ? 1 : 0,
            homeOffice: document.getElementById('homeOffice').checked
        };

        try {
            const response = await fetch('/analisis-energetico', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Código ${response.status}: ${errorText || response.statusText}`);
            }

            const data = await response.json();
            renderResults(data);

        } catch (error) {
            alert('⚠️ Error al procesar la solicitud:\n' + error.message);
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    });

    function renderResults(data) {
        // Mapeo defensivo con alternativas
        const categoria = data.categoria || data.category || 'Sin Clasificar';
        const probabilidadRaw = data.probabilidad ?? data.probability ?? data.certeza ?? 0;
        const costoRaw = data.costoEstimado ?? data.costo ?? data.costoEstimadoMensual ?? 0;
        const recomendaciones = data.recomendaciones || data.recommendations || [];

        // Conversión segura a tipo numérico
        const probNum = Number(probabilidadRaw) || 0;
        const costoNum = Number(costoRaw) || 0;

        // Renderizado
        document.getElementById('categoriaBadge').textContent = categoria;
        document.getElementById('probabilidadText').textContent = (probNum > 1 ? probNum : probNum * 100).toFixed(1) + '%';
        document.getElementById('costoValue').textContent = '$' + costoNum.toFixed(2);

        const recList = document.getElementById('recomendacionesList');
        recList.innerHTML = '';

        if (Array.isArray(recomendaciones) && recomendaciones.length > 0) {
            recomendaciones.forEach(rec => {
                const li = document.createElement('li');
                li.textContent = rec;
                recList.appendChild(li);
            });
        } else {
            const li = document.createElement('li');
            li.textContent = 'Sin recomendaciones adicionales registradas.';
            recList.appendChild(li);
        }

        document.getElementById('resultPanel').classList.remove('result-hidden');
    }
</script>

</body>
</html>
